<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='favicon.png') }}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Mini Voting System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/password-toggle.css') }}">
<script defer src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>

<style>
:root {
    --bg-purple: #e0d4fc;
    --card-gradient-top: #c4b5fd;
}

body {
    background-color: var(--bg-purple);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.main-container {
    background: linear-gradient(to bottom, var(--card-gradient-top) 0%, #ffffff 75%);
    width: 100%;
    max-width: 1000px;
    min-height: 500px;
    border-radius: 20px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.12);
    position: relative;
    overflow: hidden;
}

.main-container::after {
    content: "";
    position: absolute;
    bottom: -100px;
    left: -10%;
    width: 120%;
    height: 300px;
    background: white;
    border-radius: 50% 50% 0 0;
}

.content-body {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    padding: 80px 60px;
    align-items: center;
}

.hero-text h1 {
    font-size: 44px;
    font-weight: 700;
}

.hero-text p {
    color: #4b5563;
    margin-bottom: 30px;
}

.cta-btn {
    background: linear-gradient(to right, #6366f1, #a855f7);
    color: white;
    padding: 12px 35px;
    border-radius: 30px;
    border: none;
    font-weight: 600;
}

.form-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.input-group-custom {
    position: relative;
}

.input-group-custom i {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #a5b4fc;
}

.input-group-custom input {
    width: 100%;
    padding: 14px 15px 14px 45px;
    border-radius: 10px;
    border: 1px solid #f3f4f6;
}

.footer-links {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
    font-size: 13px;
}

.footer-links a {
    text-decoration: none;
    color: #9ca3af;
    font-weight: 500;
}
</style>
</head>

<body>

<div class="main-container">
<div class="content-body">

<div class="hero-text">
    <h1>Mini Voting System</h1>
    <p>Create your student account to vote.</p>
    <button class="cta-btn" onclick="document.getElementById('registerForm').submit()">Register</button>
</div>

<div>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
    <div class="alert alert-{{ cat }}">{{ msg }}</div>
  {% endfor %}
{% endwith %}

<form method="POST" id="registerForm" class="form-container">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="input-group-custom">
        <i class="fas fa-id-card"></i>
        <input type="text" name="college_id" placeholder="College ID" required>
    </div>

    <div class="input-group-custom">
        <i class="fas fa-lock"></i>
        <div class="password-field">
            <input id="register-password" type="password" name="password" placeholder="Password" required>
            <button class="password-toggle" type="button" aria-label="Show password"
                    aria-pressed="false" aria-controls="register-password">
                <svg class="password-toggle__eye-off" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c5 0 8.3 4.5 9 7-.3 1-1 2.1-2 3.1"></path>
                    <path d="M6.2 6.2C3.9 7.6 2.5 9.7 2 12c.7 2.5 4 7 10 7 1 0 1.9-.2 2.8-.5"></path>
                </svg>
                <svg class="password-toggle__eye" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true" hidden>
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>
    </div>

    <div class="input-group-custom">
        <i class="fas fa-lock"></i>
        <div class="password-field">
            <input id="register-confirm-password" type="password" name="confirm" placeholder="Confirm Password" required>
            <button class="password-toggle" type="button" aria-label="Show password"
                    aria-pressed="false" aria-controls="register-confirm-password">
                <svg class="password-toggle__eye-off" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c5 0 8.3 4.5 9 7-.3 1-1 2.1-2 3.1"></path>
                    <path d="M6.2 6.2C3.9 7.6 2.5 9.7 2 12c.7 2.5 4 7 10 7 1 0 1.9-.2 2.8-.5"></path>
                </svg>
                <svg class="password-toggle__eye" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true" hidden>
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>
    </div>

    <button type="submit" class="d-none"></button>

    <div class="footer-links">
        <a href="{{ url_for('login') }}">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </div>
</form>
</div>

</div>
</div>

</body>
</html>
